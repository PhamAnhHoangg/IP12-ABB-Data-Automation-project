# Local test setup: n8n + Postgres on your laptop.
# Start:  docker compose up -d     Stop: docker compose down
# All data is stored in ./data next to this file (keep the repo on E:).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ip12}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ip12}
    ports:
      - "5433:5432"   # 5433 on your laptop, so it does not clash with other Postgres containers
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ip12}"]
      interval: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      N8N_SECURE_COOKIE: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /data
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./shared:/data/shared          # Python writes detections.jsonl here
      - ./reports:/data/reports        # n8n writes the Markdown reports here
    depends_on:
      postgres:
        condition: service_healthy
